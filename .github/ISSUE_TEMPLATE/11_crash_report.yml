name: Report a crash
description: Zite is crashing or freezing or hanging.
type: Crash
labels: "state:needs triage"
body:
  - type: textarea
    attributes:
      label: Reproduction steps
      description: A step-by-step description of how to reproduce the crash from a **clean Zite install**. The more context you provide, the easier it is to find and fix the problem fast.
      placeholder: |
        1. Start Zite
        2. Perform an action
        3. Zite crashes
    validations:
      required: true
  - type: textarea
    attributes:
      label: Zite version and system specs
      description: |
        Open the command palette in Zite, then type “zite: copy system specs into clipboard”.
      placeholder: |
        Zite: v1.0.8
        OS: macOS 15.1
        Memory: 36 GiB
        Architecture: aarch64
    validations:
      required: true
  - type: textarea
    attributes:
      label: Attach Zite log file
      description: |
        Open the command palette in Zite, then type `zite: open log` to see the last 1000 lines. Or type `zite: reveal log in file manager` in the command palette to reveal the log file itself.

        ⚠️ **Please review your log file for secrets (API keys, tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>Zite.log</summary>

        <!-- Paste your log inside the code block. -->
        ```log

        ```

        </details>
    validations:
      required: false
